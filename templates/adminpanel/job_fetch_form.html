{% extends 'base.html' %}
{% block title %}Auto-Fetch Jobs — JobTrack Admin{% endblock %}

{% block content %}
<div class="jt-page">
  <div class="jt-container" style="max-width: 640px;">
    <a href="/admin-panel/jobs/" style="display:inline-flex; align-items:center; gap:6px; font-size:0.875rem; color:var(--text-primary); font-weight:700; margin-bottom:24px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to Jobs
    </a>

    <div class="jt-card">
      <h1 class="jt-section-title">Automated Job Fetcher</h1>
      <p class="jt-section-subtitle" style="margin-bottom: 24px;">Pull remote job listings directly from the free Remotive API into your database.</p>

      <form method="POST">
        {% csrf_token %}
        <div class="jt-form-group">
          <label class="jt-form-label" for="search-term">Search Keyword (e.g. Frontend, Python, Django)</label>
          <input class="jt-form-control" type="text" name="search_term" id="search-term" placeholder="Python Developer" required autofocus>
        </div>

        <div class="jt-form-group">
          <label class="jt-form-label" for="fetch-limit">Number of jobs to fetch</label>
          <select class="jt-form-control" name="limit" id="fetch-limit">
            <option value="5">5 Jobs</option>
            <option value="10" selected>10 Jobs</option>
            <option value="20">20 Jobs</option>
            <option value="50">50 Jobs</option>
          </select>
        </div>

        <button type="submit" class="jt-btn jt-btn-accent jt-btn-block jt-btn-lg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-right: 8px;"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          Fetch Jobs Now
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
