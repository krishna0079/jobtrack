{% extends 'base.html' %}
{% block title %}{{ action }} Job — JobTrack Admin{% endblock %}

{% block content %}
<div class="jt-page">
  <div class="jt-container" style="max-width: 720px;">
    <a href="/admin-panel/jobs/" style="display:inline-flex; align-items:center; gap:6px; font-size:0.875rem; color:var(--text-primary); font-weight:700; margin-bottom:24px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to Jobs
    </a>

    <div class="jt-card">
      <h1 style="font-size:1.5rem; margin-bottom:24px;">{{ action }} Job</h1>

      <form method="POST">
        {% csrf_token %}
        <div class="jt-form-group">
          <label class="jt-form-label" for="job-title">Job Title</label>
          <input class="jt-form-control" type="text" name="title" id="job-title" value="{{ job.title|default:'' }}" placeholder="Python Developer" required>
        </div>

        <div class="jt-form-group">
          <label class="jt-form-label" for="job-company">Company</label>
          <select class="jt-form-control" name="company_id" id="job-company">
            <option value="">Select Company</option>
            {% for c in companies %}
            <option value="{{ c.id }}" {% if job.company_id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="jt-form-row">
          <div class="jt-form-group">
            <label class="jt-form-label" for="job-location">Location</label>
            <input class="jt-form-control" type="text" name="location" id="job-location" value="{{ job.location|default:'' }}" placeholder="Chennai">
          </div>
          <div class="jt-form-group">
            <label class="jt-form-label" for="job-type">Job Type</label>
            <select class="jt-form-control" name="job_type" id="job-type">
              <option value="Full Time" {% if job.job_type == 'Full Time' %}selected{% endif %}>Full Time</option>
              <option value="Part Time" {% if job.job_type == 'Part Time' %}selected{% endif %}>Part Time</option>
              <option value="Contract" {% if job.job_type == 'Contract' %}selected{% endif %}>Contract</option>
              <option value="Internship" {% if job.job_type == 'Internship' %}selected{% endif %}>Internship</option>
              <option value="Remote" {% if job.job_type == 'Remote' %}selected{% endif %}>Remote</option>
            </select>
          </div>
        </div>

        <div class="jt-form-row">
          <div class="jt-form-group">
            <label class="jt-form-label" for="job-exp">Experience Level</label>
            <select class="jt-form-control" name="experience" id="job-exp">
              <option value="Fresher" {% if job.experience == 'Fresher' %}selected{% endif %}>Fresher</option>
              <option value="1-2 Years" {% if job.experience == '1-2 Years' %}selected{% endif %}>1-2 Years</option>
              <option value="3-5 Years" {% if job.experience == '3-5 Years' %}selected{% endif %}>3-5 Years</option>
              <option value="5+ Years" {% if job.experience == '5+ Years' %}selected{% endif %}>5+ Years</option>
            </select>
          </div>
          <div class="jt-form-group">
            <label class="jt-form-label" for="job-salary">Salary</label>
            <input class="jt-form-control" type="text" name="salary" id="job-salary" value="{{ job.salary|default:'' }}" placeholder="4-6 LPA">
          </div>
        </div>

        <div class="jt-form-group">
          <label class="jt-form-label" for="job-skills">Required Skills</label>
          <input class="jt-form-control" type="text" name="skills" id="job-skills" value="{{ job.skills_str|default:'' }}" placeholder="Python, Django, JavaScript, MongoDB">
          <div class="jt-form-hint">Separate skills with commas</div>
        </div>

        <div class="jt-form-group">
          <label class="jt-form-label" for="job-desc">Description</label>
          <textarea class="jt-form-control" name="description" id="job-desc" rows="5" placeholder="Job description...">{{ job.description|default:'' }}</textarea>
        </div>

        <div class="jt-form-group">
          <label class="jt-form-label" for="job-req">Requirements</label>
          <textarea class="jt-form-control" name="requirements" id="job-req" rows="4" placeholder="Job requirements...">{{ job.requirements|default:'' }}</textarea>
        </div>

        <div class="jt-form-group">
          <label class="jt-form-label" for="job-url">Application URL</label>
          <input class="jt-form-control" type="url" name="application_url" id="job-url" value="{{ job.application_url|default:'' }}" placeholder="https://company.com/careers/apply">
        </div>

        <div class="jt-form-row">
          <div class="jt-form-group">
            <label class="jt-form-label" for="job-deadline">Application Deadline</label>
            <input class="jt-form-control" type="date" name="deadline" id="job-deadline" value="{{ job.deadline_input|default:'' }}">
          </div>
          <div class="jt-form-group">
            <label class="jt-form-label" for="job-status">Status</label>
            <select class="jt-form-control" name="status" id="job-status">
              <option value="active" {% if job.status == 'active' or not job.status %}selected{% endif %}>Active</option>
              <option value="expired" {% if job.status == 'expired' %}selected{% endif %}>Expired</option>
            </select>
          </div>
        </div>

        <button type="submit" class="jt-btn jt-btn-primary jt-btn-block jt-btn-lg">{{ action }} Job</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
